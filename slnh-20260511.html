/* ── Chart.js wrapper ── */
function CJSChart({ config, height = 220 }) {
  const ref = useRef(null)
  const inst = useRef(null)
  useEffect(() => {
    if (inst.current) inst.current.destroy()
    inst.current = new Chart(ref.current, config)
    return () => inst.current?.destroy()
  }, [])
  return <canvas ref={ref} style={{ width:'100%', maxHeight: height }} height={height}/>
}

/* ── 데이터 ── */

const Card = ({children,style={}}) => (

    {children}
  </div>
)
const Badge = ({children,color=C.blue}) => (
  <span style={{background:color+'20',color,border:`1px solid ${color}44`,borderRadius:6,padding:'3px 10px',fontSize:12,fontWeight:700,display:'inline-block'}}>
    {children}
  </span>
)
const SectionTitle = ({children,sub}) => (
  <div style={{marginBottom:18}}>
    <h2 style={{color:C.text,fontSize:17,fontWeight:800,margin:0,lineHeight:1.3}}>{children}</h2>
    {sub && <p style={{color:C.muted,fontSize:12,margin:'5px 0 0',lineHeight:1.5}}>{sub}</p>}
  </div>
)
const Row = ({label,value,color=C.text}) => (
  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'13px 0',borderBottom:`1px solid ${C.border}`}}>
    <span style={{color:C.muted,fontSize:13}}>{label}</span>

const InfoBox = ({children,color=C.blue}) => (

        return (
          <div key={i} style={{marginBottom:18}}>
            <div style={{color:C.muted,fontSize:12,marginBottom:8}}>{v.metric}</div>
            {[{label:'SLNH',val:v.SLNH,color:C.cyan},{label:'IREN',val:v.IREN,color:C.orange}].map(({label,val,color}) => (
              <div key={label} style={{marginBottom:6}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                  <span style={{color,fontSize:13,fontWeight:700}}>{label}</span>
                  <span style={{color,fontSize:13,fontWeight:700}}>{val<10?val.toFixed(2):val.toLocaleString()}</span>
                </div>
                <div style={{background:C.border,borderRadius:4,height:8}}>
                  <div style={{width:`${(val/maxV)*100}%`,background:color,borderRadius:4,height:'100%'}}/>
                </div>
              </div>
            ))}
          </div>
        )
      })}
    </Card>

    <Card>
      <SectionTitle>"제2의 IREN" — 최종 판단</SectionTitle>

        {title:'지금 당장',score:'❌ 아직 아님',color:C.red,desc:'IREN은 660MW 실가동+수익성. SLNH는 235MW+적자. 같은 테마지만 실행력 차이 큼.'},
        {title:'1~2년 후',score:'⚠️ 조건부 가능',color:C.yellow,desc:'Dorothy 3 AI 계약 + Kati 2 착공 + SEPA 해소 달성 시 IREN 수준 재평가 가능. $5+ 시나리오.'},
        {title:'투자 포지션',score:'🎲 소액 투기적',color:C.blue,desc:'포트폴리오 2~3% 이하. 손절선 $1. Dorothy 3 계약 체결이 핵심 트리거. 반드시 분할매수.'},
      ].map((c,i) => (
        <div key={i} style={{padding:'16px 14px',marginBottom:i<2?10:0,background:c.color+'12',borderRadius:12,border:`1px solid ${c.color}30`}}>
          <div style={{color:C.muted,fontSize:12,marginBottom:5}}>{c.title}</div>
          <div style={{color:c.color,fontSize:18,fontWeight:900,marginBottom:8}}>{c.score}</div>
          <div style={{color:C.muted,fontSize:13,lineHeight:1.6}}>{c.desc}</div>
        </div>
      ))}
    </Card>
  </>
}

function makeChart(cRef, chRef, cfg) {
  useEffect(function() {
    if (!cRef.current) return;
    if (chRef.current) chRef.current.destroy();
    chRef.current = new Chart(cRef.current, cfg);
    return function() { if (chRef.current) { chRef.current.destroy(); chRef.current = null; } };
  }, []);
}

      e('div', {className:'sub'}, '채굴 아닌 정제·초크광물 병목 · BOM 8개 라인아이템 | 2026-08-19 | 14개 발굴종목')
    ),
    e('div', {className:'tabs'},
      TABS.map(function(n,i){
        return e('button', {key:i, className:'tb'+(tab===i?' on':''), onClick:function(){setTab(i);}}, n);
      })
    ),
    e('div', {className:'cnt'},
      tab===0 ? Tab1() :
      tab===1 ? Tab2() :
      tab===2 ? e(Tab3,null) :
      tab===3 ? e(Tab4,null) :
      tab===4 ? e(Tab5,null) :
      e(Tab6,null)
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App,null));
</script>
</body>
</html>

<style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const TABS = [
  { id: 'overview', label: '개요' },
  { id: 'tech', label: '기술적분석' },
  { id: 'earnings', label: '실적' },
  { id: 'fin', label: '재무' },
  { id: 'compare', label: '비교' },
  { id: 'x', label: '🐦 X' },
  { id: 'reddit', label: '💬 Reddit' },
  { id: 'social', label: '📱 소셜' },
  { id: 'terms', label: '📖 용어' },
  { id: 'multi', label: '🔟 멀티배거' },
];

function KV({k, v}) {
  return <div className="kv"><span className="k">{k}</span><span className="v">{v}</span></div>;
}
function Card({title, children, cls}) {
  return <div className={"card" + (cls ? " " + cls : "")}>{title && <h3>{title}</h3>}{children}</div>;
}
function Tag({type, children}) {
  return <span className={"tag tag-" + type}>{children}</span>;
}
function CChart({type, data, options, tall}) {
  const ref = useRef(null);
  const inst = useRef(null);
  useEffect(() => {
    if (inst.current) inst.current.destroy();
    inst.current = new window.Chart(ref.current, { type, data, options });
    return () => { if (inst.current) inst.current.destroy(); };
  }, []);
  return <div className={"chart-box" + (tall ? " tall" : "")}><canvas ref={ref}></canvas></div>;
}
const darkTicks = { color: '#94a3b8', font: { size: 10 } };

function OverviewTab() {
  return (
    <div className="section">
      <Card title="🏢 기업 개요">

          <li>Jacintoport 증설 + 블랙록 9.9% 신규 지분</li>
        </ul>
        <h4>🐻 Bear Case</h4>
        <ul className="bear">
          <li>고밸류에이션(PEG 2.46, P/B 9.2x) — 실적 미스 시 −15% 급락 전례</li>
          <li>기술적 하락추세 미해소 + 공매도 6.75%</li>
          <li>Petrochemical −49% 침체 · 내부자 매도 지속</li>
        </ul>
        <h4>🎯 액션 플랜</h4>

          <tr><td>1차 매수</td><td>$180–190</td><td>포트폴리오 2–3%</td></tr>

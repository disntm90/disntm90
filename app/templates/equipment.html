{% extends "base.html" %}
{% block title %}설비 관리 - 설비 배포 대시보드{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="mb-0">설비 관리</h4>
  <div class="d-flex gap-2">
    <button class="btn btn-outline-success btn-sm" onclick="runHealthCheck()">
      <span>전체 헬스체크</span>
      <span class="spinner-border spinner-border-sm htmx-indicator" id="healthSpinner"></span>
    </button>
    <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ 설비 추가</button>
  </div>
</div>

<div class="card">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th>설비명</th>
            <th>IP</th>
            <th>포트</th>
            <th>프로토콜</th>
            <th>상태</th>
            <th>연결</th>
            <th>최근 점검</th>
            <th>작업</th>
          </tr>
        </thead>
        <tbody id="equipmentTable">
          {% for e in equipment_list %}
            {% include "_equipment_row.html" %}
          {% else %}
          <tr id="emptyRow"><td colspan="8" class="text-center text-muted py-4">등록된 설비가 없습니다.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- 추가/수정 모달 -->
<div class="modal fade" id="equipmentModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">설비 추가</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editId">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">설비명 <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="f_name" placeholder="예: 설비-A">
          </div>
          <div class="col-md-6">
            <label class="form-label">IP 주소 <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="f_ip" placeholder="예: 192.168.1.100">
          </div>
          <div class="col-md-4">
            <label class="form-label">포트</label>
            <input type="number" class="form-control" id="f_port" value="21">
          </div>
          <div class="col-md-4">
            <label class="form-label">FTP 사용자</label>
            <input type="text" class="form-control" id="f_user" placeholder="ftp user">
          </div>
          <div class="col-md-4">
            <label class="form-label">FTP 비밀번호</label>
            <input type="password" class="form-control" id="f_pass" placeholder="ftp password">
          </div>
          <div class="col-md-4 d-flex align-items-end">
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="f_sftp">
              <label class="form-check-label" for="f_sftp">SFTP 사용</label>
            </div>
          </div>
          <div class="col-12">
            <label class="form-label">설명 (선택)</label>
            <input type="text" class="form-control" id="f_desc" placeholder="설비 설명">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
        <button type="button" class="btn btn-primary" onclick="saveEquipment()">저장</button>
      </div>
    </div>
  </div>
</div>

<div id="alertArea" class="position-fixed bottom-0 end-0 p-3" style="z-index:1100; min-width:300px"></div>
{% endblock %}

{% block scripts %}
<script>
  const modal = new bootstrap.Modal(document.getElementById('equipmentModal'));

  function showAlert(msg, type = 'info') {
    const el = document.createElement('div');
    el.className = `alert alert-${type} alert-dismissible fade show shadow-sm`;
    el.innerHTML = `${msg}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
    document.getElementById('alertArea').appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }

  function openAddModal() {
    document.getElementById('modalTitle').textContent = '설비 추가';
    document.getElementById('editId').value = '';
    ['f_name','f_ip','f_user','f_pass','f_desc'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f_port').value = 21;
    document.getElementById('f_sftp').checked = false;
    modal.show();
  }

  function openEditModal(id) {
    fetch(`/api/equipment`)
      .then(r => r.json())
      .then(list => {
        const e = list.find(x => x.id === id);
        if (!e) return;
        document.getElementById('modalTitle').textContent = '설비 수정';
        document.getElementById('editId').value = e.id;
        document.getElementById('f_name').value = e.name;
        document.getElementById('f_ip').value = e.ip;
        document.getElementById('f_port').value = e.port;
        document.getElementById('f_user').value = e.ftp_user;
        document.getElementById('f_pass').value = '';
        document.getElementById('f_sftp').checked = e.use_sftp;
        document.getElementById('f_desc').value = e.description;
        modal.show();
      });
  }

  function saveEquipment() {
    const editId = document.getElementById('editId').value;
    const payload = {
      name: document.getElementById('f_name').value.trim(),
      ip: document.getElementById('f_ip').value.trim(),
      port: parseInt(document.getElementById('f_port').value),
      ftp_user: document.getElementById('f_user').value.trim(),
      ftp_pass: document.getElementById('f_pass').value,
      use_sftp: document.getElementById('f_sftp').checked,
      description: document.getElementById('f_desc').value.trim(),
    };

    if (!payload.name || !payload.ip) {
      showAlert('설비명과 IP는 필수입니다.', 'warning'); return;
    }

    const url = editId ? `/api/equipment/${editId}` : '/api/equipment';
    const method = editId ? 'PUT' : 'POST';

    fetch(url, {method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)})
      .then(r => r.json().then(d => ({ok: r.ok, data: d})))
      .then(({ok, data}) => {
        if (ok) { showAlert(data.message, 'success'); modal.hide(); setTimeout(() => location.reload(), 500); }
        else showAlert(data.detail || '저장 실패', 'danger');
      })
      .catch(() => showAlert('저장 중 오류 발생', 'danger'));
  }

  function runHealthCheck() {
    document.getElementById('healthSpinner').classList.add('htmx-request');
    fetch('/api/equipment/health-check', {method: 'POST'})
      .then(r => r.json())
      .then(d => {
        const s = d.summary || {};
        showAlert(`헬스체크 완료 — 정상 ${s.ok}/${s.total}, 실패 ${s.failed}`, s.failed ? 'warning' : 'success');
        setTimeout(() => location.reload(), 600);
      })
      .catch(() => showAlert('헬스체크 실패', 'danger'))
      .finally(() => document.getElementById('healthSpinner').classList.remove('htmx-request'));
  }

  // HTMX 응답 후 알림 (toggle/delete)
  document.body.addEventListener('htmx:afterSwap', (evt) => {
    const trigger = evt.detail.requestConfig;
    if (!trigger) return;
    if (trigger.verb === 'delete') showAlert('설비가 삭제되었습니다.', 'success');
  });
  document.body.addEventListener('htmx:responseError', (evt) => {
    showAlert('요청 처리 실패 (' + evt.detail.xhr.status + ')', 'danger');
  });
</script>
{% endblock %}

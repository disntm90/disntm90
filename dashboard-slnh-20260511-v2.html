function CJSChart({ config, height=220 }) {
  const ref = useRef(null), inst = useRef(null)
  useEffect(() => {
    if (inst.current) inst.current.destroy()
    inst.current = new Chart(ref.current, config)
    return () => inst.current?.destroy()
  }, [])
  return <canvas ref={ref} style={{width:'100%',maxHeight:height}} height={height}/>
}

const Card = ({children,style={}}) => (

            {label:'52주 고점', value:'$5.14', sub:'', color:C.cyan},
            {label:'저점 대비', value:'+341%', sub:'', color:C.green},
            {label:'시가총액', value:'$271M', sub:'', color:C.text},
            {label:'목표주가', value:'$5.00', sub:'+173%', color:C.purple},
          ].map((s,i) => (
            <div key={i} style={{background:C.cardBg,border:`1px solid ${C.border}`,borderRadius:12,padding:'11px 8px',textAlign:'center'}}>
              <div style={{color:s.color,fontSize:18,fontWeight:900,lineHeight:1}}>{s.value}</div>
              <div style={{color:C.muted,fontSize:10,marginTop:4}}>{s.label}</div>
              {s.sub && <div style={{color:s.color+'bb',fontSize:10,marginTop:2}}>{s.sub}</div>}
            </div>
          ))}
        </div>
      </div>

      {/* 탭바 */}
      <div style={{borderBottom:`1px solid ${C.border}`,background:C.cardBg,overflowX:'auto',whiteSpace:'nowrap',WebkitOverflowScrolling:'touch'}}>
        {tabs.map(t => (
          <button key={t.id} onClick={()=>setTab(t.id)} style={{
            display:'inline-block',background:'none',
            color:tab===t.id?C.green:C.muted,
            border:'none',borderBottom:tab===t.id?`3px solid ${C.green}`:'3px solid transparent',
            padding:'13px 16px',fontSize:12,fontWeight:700,cursor:'pointer',
          }}>{t.label}</button>
        ))}
      </div>

      {/* 콘텐츠 */}
      <div style={{padding:'16px',maxWidth:600,margin:'0 auto'}}>
        {tab==='overview' && <OverviewTab/>}
        {tab==='tech'     && <TechTab/>}
        {tab==='fund'     && <FinancialTab/>}
        {tab==='sent'     && <SentimentTab/>}
        {tab==='compare'  && <CompareTab/>}
        {tab==='conclude' && <ConclusionTab/>}
      </div>
    </div>
  )
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
</script>
</body>
</html>

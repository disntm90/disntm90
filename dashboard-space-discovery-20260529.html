/* ── Charts Tab ── */
function ChartsTab() {
  var capRef   = useRef(null);
  var capChart = useRef(null);
  var mbRef    = useRef(null);
  var mbChart  = useRef(null);
  var rsiRef   = useRef(null);
  var rsiChart = useRef(null);

  var labels  = STOCKS.map(function(s) { return s.ticker; });
  var capNums = [8.4, 0.97, 1.94, 5.15, 8.2, 0.2];
  var mbNums  = STOCKS.map(function(s) { return s.mb; });
  var rsiNums = STOCKS.map(function(s) { return s.rsi; });
  var COLORS  = ['#ef4444','#7c3aed','#7c3aed','#fbbf24','#fbbf24','#fbbf24'];

  makeChart(capRef, capChart, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: '시가총액($B)',
        data: capNums,
        backgroundColor: COLORS.map(function(c) { return c + '99'; }),
        borderColor: COLORS,
        borderWidth: 2,
        borderRadius: 6
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(c) { return '$' + c.raw + 'B'; } } } },
      scales: {
        x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } },
        y: { ticks: { color: '#94a3b8', font: { size: 10 }, callback: function(v) { return '$' + v + 'B'; } }, grid: { color: '#1e293b' } }
      }
    }
  });

  makeChart(mbRef, mbChart, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: '멀티배거 점수',
        data: mbNums,
        backgroundColor: mbNums.map(function(v) { return v >= 5.5 ? '#a78bfa99' : v >= 5.0 ? '#7c3aed99' : '#4c1d9599'; }),
        borderColor: mbNums.map(function(v) { return v >= 5.5 ? '#a78bfa' : v >= 5.0 ? '#7c3aed' : '#6d28d9'; }),
        borderWidth: 2,
        borderRadius: 6
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(c) { return c.raw + '/8'; } } } },
      scales: {
        x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } },
        y: { min: 0, max: 8, ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } }
      }
    }
  });

  makeChart(rsiRef, rsiChart, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'RSI',
        data: rsiNums,
        backgroundColor: rsiNums.map(function(v) { return v <= 55 ? '#a78bfa99' : v <= 65 ? '#fbbf2499' : '#ef444499'; }),
        borderColor: rsiNums.map(function(v) { return v <= 55 ? '#a78bfa' : v <= 65 ? '#fbbf24' : '#ef4444'; }),
        borderWidth: 2,
        borderRadius: 6
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: function(c) { return 'RSI ' + c.raw; } } },
        annotation: {}
      },
      scales: {
        x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } },
        y: { min: 0, max: 100, ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } }
      }
    }
  });

  return e('div', null,
    e('div', {className:'card'},
      e('div', {className:'card-title'}, '시가총액 비교 ($B)'),
      e('div', {className:'warn-box', style:{marginBottom:'8px'}}, '⚠️ $5B 이하 우선 (멀티배거 가능성 높음) — SPIR·MNTS 주목'),
      e('div', {className:'chart-wrap'}, e('canvas', {ref: capRef}))
    ),
    e('div', {className:'card'},
      e('div', {className:'card-title'}, '멀티배거 점수 (Anna Yartseva 8기준)'),
      e('div', {className:'chart-wrap'}, e('canvas', {ref: mbRef}))
    ),
    e('div', {className:'card'},
      e('div', {className:'card-title'}, 'RSI 현황 (추정)'),
      e('div', {className:'insight-box', style:{marginBottom:'8px'}}, '🟣 55 이하: 진입 유리 (KRMN·MNTS) | 🟡 55~65: 중립 | 🔴 70 이상: 단기 과매수 주의 (BKSY·RDW)'),
      e('div', {className:'chart-wrap'}, e('canvas', {ref: rsiRef}))
    )
  );
}

/* ── MB Detail ── */
function MBDetail(props) {
  var s = props.stock;
  var yesCount = s.mb_items.filter(function(x) { return x.cls === 'mb-yes'; }).length;
  var partCount = s.mb_items.filter(function(x) { return x.cls === 'mb-part'; }).length;
  var score = yesCount + partCount * 0.5;
  var grade = score >= 6 ? '매우 우수' : score >= 5 ? '우수 · 매수 검토' : score >= 4 ? '보통 · 선별적 접근' : '낮음 · 고위험';

  return e('div', null,
    e('div', {className:'card'},
      e('div', {className:'total-score-box'},
        e('div', null,
          e('span', {className:'total-num'}, s.mb.toFixed(1)),
          e('span', {className:'total-denom'}, ' / 8')
        ),
        e('div', {className:'score-grade'}, s.ticker + ' — ' + grade)
      ),
      s.mb_items.map(function(item, i) {
        return e('div', {key: i, className:'mb-item'},
          e('div', {className:'mb-label'}, item.label),
          e('div', {className:'mb-val ' + item.cls}, item.v)
        );
      }),
      e('div', {className:'warn-box', style:{marginTop:'10px'}},
        '⚠️ 본 분석은 교육 목적이며 투자 권고가 아닙니다. 실제 투자 전 독립적인 리서치를 반드시 수행하세요.'
      )
    )
  );
}

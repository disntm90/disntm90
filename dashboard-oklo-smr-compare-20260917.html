function App() {
  var sa = useState(0); var tab = sa[0]; var setTab = sa[1];
  var TABS = ['⚖️개요비교','🔬기술·사업','💰재무·밸류','🏁결론'];
  return e('div', null,
    e('div', {className:'hdr'},
      e('a', {href:'https://disntm90.github.io/disntm90/', className:'back'}, '← 목록으로'),
      e('h1', null, '⚛️ OKLO vs SMR(NuScale) 비교분석'),
      e('div', {className:'sub'}, 'SMR(소형모듈원자로) 대결 · AI 전력 테마 | 2026-09-17')
    ),
    e('div', {className:'tabs'},
      TABS.map(function(n,i){
        return e('button', {key:i, className:'tb'+(tab===i?' on':''), onClick:function(){setTab(i);}}, n);
      })
    ),
    e('div', {className:'cnt'},
      tab===0 ? e(Tab1,null) :
      tab===1 ? e(Tab2,null) :
      tab===2 ? e(Tab3,null) :
      e(Tab4,null)

  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App,null));

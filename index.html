<!doctype html>
<html lang="ko">

</head>
<body>
  <div id="root"></div>
  <script type="text/babel">

const valuationComp = [
  { metric: '시가총액 ($M)',      SLNH: 228,  IREN: 1820 },
  { metric: '운영 MW',           SLNH: 235,  IREN: 660  },
  { metric: 'MW당 시총 ($M/MW)', SLNH: 0.97, IREN: 2.76 },

  { metric: '파이프라인 (GW)',    SLNH: 4.3,  IREN: 2.75 },

const Card = ({ children, style = {} }) => (
  <div style={{
    background: C.cardBg, border: `1px solid ${C.border}`,
    borderRadius: 16, padding: '20px 16px', marginBottom: 14, ...style,
  }}>
    {children}
  </div>
)

const Badge = ({ children, color = C.blue }) => (
  <span style={{
    background: color + '20', color, border: `1px solid ${color}44`,
    borderRadius: 6, padding: '3px 10px', fontSize: 12, fontWeight: 700,
    display: 'inline-block',
  }}>
    {children}
  </span>
)

const SectionTitle = ({ children, sub }) => (
  <div style={{ marginBottom: 18 }}>
    <h2 style={{ color: C.text, fontSize: 17, fontWeight: 800, margin: 0, lineHeight: 1.3 }}>{children}</h2>
    {sub && <p style={{ color: C.muted, fontSize: 12, margin: '5px 0 0', lineHeight: 1.5 }}>{sub}</p>}
  </div>
)

const Row = ({ label, value, color = C.text, sub }) => (
  <div style={{
    display: 'flex', justifyContent: 'space-between', alignItems: 'center',
    padding: '13px 0', borderBottom: `1px solid ${C.border}`,
  }}>
    <div>
      <div style={{ color: C.muted, fontSize: 13 }}>{label}</div>
      {sub && <div style={{ color: C.gray, fontSize: 11, marginTop: 2 }}>{sub}</div>}
    </div>
    <span style={{ color, fontWeight: 800, fontSize: 15 }}>{value}</span>
  </div>
)

const InfoBox = ({ children, color = C.blue }) => (
  <div style={{
    background: color + '12', border: `1px solid ${color}30`,
    borderRadius: 10, padding: '12px 14px', marginTop: 12,
  }}>
    <p style={{ color, fontSize: 13, margin: 0, lineHeight: 1.6, fontWeight: 500 }}>{children}</p>
  </div>
)

const Tip = ({ active, payload, label }) => {
  if (!active || !payload?.length) return null
  return (
    <div style={{ background: '#0a0f1e', border: `1px solid ${C.border}`, borderRadius: 8, padding: '8px 12px' }}>
      <p style={{ color: C.muted, fontSize: 12, margin: '0 0 4px' }}>{label}</p>
      {payload.map((p, i) => (
        <p key={i} style={{ color: p.color, fontSize: 13, fontWeight: 700, margin: '2px 0' }}>
          {p.name}: {p.value}
        </p>
      ))}
    </div>
  )
}

function App() {

    { id: 'overview',  label: '📊 현황' },
    { id: 'capacity',  label: '⚡ 전력' },

    { id: 'risk',      label: '⚠️ 리스크' },
    { id: 'compare',   label: '🆚 IREN' },
  ]

  return (
    <div style={{ background: C.darkBg, minHeight: '100vh', fontFamily: 'system-ui, -apple-system, sans-serif', color: C.text }}>

      <div style={{ background: 'linear-gradient(180deg,#0f1f3d 0%,#0a0f1e 100%)', padding: '20px 16px 24px' }}>

          </div>
          <div>
            <div style={{ fontWeight: 800, fontSize: 18, lineHeight: 1.2 }}>Soluna Holdings</div>

            { label: '52주 저점',  value: '$0.42', sub: '상장폐지 위기', color: C.red    },
            { label: '52주 고점',  value: '$5.14', sub: '',             color: C.cyan   },
            { label: '1개월 수익', value: '+128%', sub: '',             color: C.green  },
            { label: '시가총액',   value: '$228M', sub: '',             color: C.text   },
            { label: '목표가',     value: '$5.00', sub: '+224%',        color: C.purple },
          ].map((s, i) => (
            <div key={i} style={{
              background: C.cardBg, border: `1px solid ${C.border}`,
              borderRadius: 12, padding: '12px 8px', textAlign: 'center',
            }}>
              <div style={{ color: s.color, fontSize: 20, fontWeight: 900, lineHeight: 1 }}>{s.value}</div>
              <div style={{ color: C.muted, fontSize: 11, marginTop: 4 }}>{s.label}</div>
              {s.sub && <div style={{ color: s.color + 'bb', fontSize: 10, marginTop: 2 }}>{s.sub}</div>}

        borderBottom: `1px solid ${C.border}`, background: C.cardBg,

          <button key={t.id} onClick={() => setTab(t.id)} style={{
            display: 'inline-block', background: 'none',

            border: 'none',
            borderBottom: tab === t.id ? `3px solid ${C.cyan}` : '3px solid transparent',
            padding: '14px 18px', fontSize: 13, fontWeight: 700, cursor: 'pointer',

            {t.label}
          </button>
        ))}

      <div style={{ padding: '16px', maxWidth: 600, margin: '0 auto' }}>

        {tab === 'overview' && (
          <>

              <ResponsiveContainer width="100%" height={200}>
                <AreaChart data={priceHistory}>

                    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">

                    </linearGradient>
                  </defs>
                  <CartesianGrid strokeDasharray="3 3" stroke={C.border}/>

                </AreaChart>
              </ResponsiveContainer>
              <InfoBox color={C.red}>빨간 점선 아래 = Nasdaq 상장폐지 기준선 ($1.00)</InfoBox>
            </Card>

            <Card>
              <SectionTitle>주요 이벤트 타임라인</SectionTitle>

              </ResponsiveContainer>

                {[['운영 중', C.green], ['준공 중', C.yellow], ['계획', C.blue]].map(([l, c]) => (
                  <div key={l} style={{ display: 'flex', alignItems: 'center', gap: 6 }}>

              <SectionTitle sub="Briscoe 150MW 풍력 — $53M 인수 효과">핵심 자산: Briscoe 풍력</SectionTitle>

                  <ReferenceLine y={0} stroke={C.border}/>
                  <Bar dataKey="revenue" name="매출"   fill={C.green} radius={[4, 4, 0, 0]}/>

      return function() {

            e('div', {style:{background:BD2, borderRadius:'4px', height:'6px'}},
              e('div', {style:{background:CHOKE_COLOR[s.choke]||THEME, width:(s.score/8*100)+'%', height:'100%', borderRadius:'4px'}})
            )
          ),
          e('p', {style:{color:'#d1d5db', fontSize:'12px', lineHeight:'1.6'}}, POINTS[i])
        );
      })
    );
  }

  /* ── Tab4 비교차트 (hooks) ─────────────────────── */
  function Tab4() {
    var c1 = useRef(null); var r1 = useRef(null);
    var c2 = useRef(null); var r2 = useRef(null);
    var c3 = useRef(null); var r3 = useRef(null);

    var labels = STOCKS.map(function(s){ return s.ticker; });
    var colors = STOCKS.map(function(s){ return CHOKE_COLOR[s.choke]||THEME; });

    var baseOpts = {
      indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color:'#9ca3af' }, grid: { color:BD2 } },
        y: { ticks: { color:'#e5e7eb' }, grid: { color:BD2 } }
      },
      responsive: true
    };

    makeChart(c1, r1, {
      type: 'bar',
      data: { labels: labels, datasets: [{ label:'시가총액($B)', data: STOCKS.map(function(s){return s.mcap;}), backgroundColor: colors }] },
      options: Object.assign({}, baseOpts)
    });
    makeChart(c2, r2, {
      type: 'bar',
      data: { labels: labels, datasets: [{ label:'멀티배거점수', data: STOCKS.map(function(s){return s.score;}), backgroundColor: colors }] },
      options: Object.assign({}, baseOpts, { scales: Object.assign({}, baseOpts.scales, { x: { min:0, max:8, ticks:{color:'#9ca3af'}, grid:{color:BD2} } }) })
    });
    makeChart(c3, r3, {
      type: 'bar',
      data: { labels: labels, datasets: [{ label:'RSI', data: STOCKS.map(function(s){return s.rsi;}), backgroundColor: colors }] },
      options: Object.assign({}, baseOpts, { scales: Object.assign({}, baseOpts.scales, { x: { min:0, max:100, ticks:{color:'#9ca3af'}, grid:{color:BD2} } }) })
    });

    return e('div', {style:{padding:'20px'}},
      e('h2', {style:{color:THEME, marginBottom:'16px', fontSize:'18px'}}, '📊 비교 차트'),
      [
        {ref:c1, title:'시가총액 ($B)'},
        {ref:c2, title:'멀티배거 점수 (/8)'},
        {ref:c3, title:'RSI (30~55 목표 구간)'}
      ].map(function(item, i) {
        return e('div', {key:i, style:{background:BD, borderRadius:'8px', padding:'14px', marginBottom:'14px'}},
          e('h3', {style:{color:'#9ca3af', fontSize:'13px', marginBottom:'10px'}}, item.title),
          e('canvas', {ref:item.ref, height:320})
        );
      })
    );
  }

  /* ── Tab5 멀티배거 (hooks) ─────────────────────── */
  function Tab5() {
    var sa = useState(STOCKS[0].ticker);
    var sel = sa[0]; var setSel = sa[1];

    var items = SCORES[sel] || [];
    var total = items.reduce(function(a,b){return a+b;}, 0);
    var stock = STOCKS.filter(function(s){return s.ticker===sel;})[0] || STOCKS[0];

    return e('div', {style:{padding:'20px'}},
      e('h2', {style:{color:THEME, marginBottom:'16px', fontSize:'18px'}}, '🔟 멀티배거 분석 (Anna Yartseva 8항목)'),
      e('div', {style:{display:'flex', flexWrap:'wrap', gap:'8px', marginBottom:'16px'}},
        STOCKS.map(function(s) {
          return e('button', {
            key: s.ticker,
            onClick: function(){ setSel(s.ticker); },
            style:{
              background: sel===s.ticker ? (CHOKE_COLOR[s.choke]||THEME) : BD2,
              color: sel===s.ticker ? '#000' : '#e5e7eb',
              border: 'none', borderRadius: '6px', padding: '6px 12px',
              cursor: 'pointer', fontSize: '12px', fontWeight: 'bold'
            }
          }, s.ticker);
        })
      ),
      e('div', {style:{background:BD, borderRadius:'10px', padding:'16px', marginBottom:'16px'}},
        e('div', {style:{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'12px'}},
          e('div', null,
            e('h3', {style:{color:CHOKE_COLOR[stock.choke]||THEME, fontSize:'16px'}}, sel+' — '+stock.name),
            e('p', {style:{color:'#9ca3af', fontSize:'12px'}}, stock.choke)
          ),
          e('span', {style:{background:CHOKE_COLOR[stock.choke]||THEME, color:'#000',
                             borderRadius:'6px', padding:'4px 14px', fontWeight:'bold', fontSize:'16px'}}, total+'/8점')
        ),
        YARTSEVA.map(function(item, i) {
          var pass = items[i]===1;
          return e('div', {key:i,
            style:{display:'flex', alignItems:'center', gap:'10px',
                   padding:'8px 0', borderBottom:'1px solid '+BD2}},
            e('span', {style:{fontSize:'16px'}}, pass ? '✅' : '❌'),
            e('span', {style:{color: pass ? '#d1fae5' : '#6b7280', fontSize:'13px'}}, item)
          );
        })
      )
    );
  }

  /* ── Tab6 전략 ─────────────────────────────────── */
  function Tab6() {
    var ranking = STOCKS.slice().sort(function(a,b){
      return b.score - a.score || a.rsi - b.rsi;
    });

    return e('div', {style:{padding:'20px'}},
      e('h2', {style:{color:THEME, marginBottom:'16px', fontSize:'18px'}}, '🎯 투자 전략'),

      e('div', {style:{background:BD, borderRadius:'8px', padding:'14px', marginBottom:'14px'}},
        e('h3', {style:{color:'#fbbf24', marginBottom:'10px', fontSize:'14px'}}, '우선순위 순위표'),
        ranking.map(function(s, i) {
          return e('div', {key:s.ticker,
            style:{display:'flex', alignItems:'center', gap:'12px',
                   padding:'8px 0', borderBottom:'1px solid '+BD2}},
            e('span', {style:{color:'#6b7280', fontSize:'13px', width:'22px', flexShrink:0}}, '#'+(i+1)),
            e('span', {style:{color:CHOKE_COLOR[s.choke]||THEME, fontWeight:'bold',
                               fontSize:'14px', width:'50px', flexShrink:0}}, s.ticker),
            e('div', {style:{flex:1}},
              e('div', {style:{background:BD2, borderRadius:'3px', height:'5px'}},
                e('div', {style:{background:CHOKE_COLOR[s.choke]||THEME,
                                  width:(s.score/8*100)+'%', height:'100%', borderRadius:'3px'}})
              )
            ),
            e('span', {style:{color:'#9ca3af', fontSize:'12px', width:'35px', textAlign:'right', flexShrink:0}}, s.score+'/8')
          );
        })
      ),

      e('div', {style:{background:'#064e3b', borderRadius:'8px', padding:'14px', marginBottom:'14px'}},
        e('h3', {style:{color:'#6ee7b7', marginBottom:'12px', fontSize:'14px'}}, '포트폴리오 제안'),
        [
          {label:'핵심 보유 (40%)', tickers:'VPG + ALNT + AEVA', desc:'병목 확실, 멀티배거 점수 6~7점. 수주잔고·매출 성장 검증.'},
          {label:'성장 노출 (35%)', tickers:'AMBA + NOVT + AXTI', desc:'AI 비전·정밀 서브시스템·기판 3중 노출. 중형주 안정성.'},
          {label:'투기·분산 (25%)', tickers:'PDYN + ULBI + MP + NNDM', desc:'고위험·고성장. 각 2~5% 소액 배분 권장.'}
        ].map(function(p) {
          return e('div', {key:p.label, style:{marginBottom:'12px'}},
            e('div', {style:{display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:'4px', marginBottom:'4px'}},
              e('span', {style:{color:'#34d399', fontWeight:'bold', fontSize:'13px'}}, p.label),
              e('span', {style:{color:'#6ee7b7', fontSize:'12px'}}, p.tickers)
            ),
            e('p', {style:{color:'#a7f3d0', fontSize:'12px'}}, p.desc)
          );
        })
      ),

      e('div', {style:{background:'#7c2d12', borderRadius:'8px', padding:'14px', marginBottom:'14px'}},
        e('h3', {style:{color:'#fca5a5', marginBottom:'10px', fontSize:'14px'}}, '⚠️ 주의 종목'),
        e('div', {style:{marginBottom:'8px'}},
          e('span', {style:{color:'#f97316', fontWeight:'bold'}}, 'RCAT '),
          e('span', {style:{color:'#fca5a5', fontSize:'13px'}},
            '— 최근 5월~6월 70%+ 급등. 단기 과열 구간 진입. 추격 매수 위험. 조정 후 $10~11대 재진입 고려.')
        ),
        e('div', null,
          e('span', {style:{color:'#f97316', fontWeight:'bold'}}, 'NNDM '),
          e('span', {style:{color:'#fca5a5', fontSize:'13px'}},
            '— 반복적 주식 희석 리스크. 마이크로캡 유동성 제한. 단순 테마 참여 시 소액만 고려.')
        )
      ),

      e('div', {style:{background:BD, borderRadius:'8px', padding:'14px'}},
        e('h3', {style:{color:'#60a5fa', marginBottom:'10px', fontSize:'14px'}}, '주요 촉매 & 리스크'),
        e('div', {style:{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px'}},
          e('div', null,
            e('p', {style:{color:'#34d399', fontWeight:'bold', marginBottom:'6px', fontSize:'12px'}}, '✅ 상승 촉매'),
            ['Tesla Optimus 양산 공식 발표', 'NVIDIA Gr00t 물리AI 2.0 출시', '희토류 탈중국화 법안 통과', '방산 로봇 예산 대폭 증가'].map(function(t, i) {
              return e('p', {key:i, style:{color:'#d1d5db', fontSize:'12px', marginBottom:'4px'}}, '• '+t);
            })
          ),
          e('div', null,
            e('p', {style:{color:'#ef4444', fontWeight:'bold', marginBottom:'6px', fontSize:'12px'}}, '❌ 리스크'),
            ['양산 일정 지연 (Optimus)', '중국 희토류 수출 제한 해제', '금리 상승 → 소형주 멀티플 압축', 'Tesla 부품 내재화 가속'].map(function(t, i) {
              return e('p', {key:i, style:{color:'#d1d5db', fontSize:'12px', marginBottom:'4px'}}, '• '+t);
            })
          )
        )
      )
    );
  }

  /* ── Main App ──────────────────────────────────── */
  function App() {
    var sa = useState(0);
    var tab = sa[0]; var setTab = sa[1];

    var TABS = ['🗺️ 밸류체인', '🔬 기술분석', '🔍 발굴종목', '📊 비교차트', '🔟 멀티배거', '🎯 전략'];

    return e('div', {style:{maxWidth:'800px', margin:'0 auto', paddingBottom:'40px'}},
      e('div', {style:{background:'linear-gradient(135deg,#064e3b,#065f46)', padding:'20px'}},
        e('a', {href:'https://disntm90.github.io/disntm90/',
                style:{color:'#6ee7b7', fontSize:'13px', textDecoration:'none', display:'block', marginBottom:'8px'}},
          '← 목록으로'),
        e('h1', {style:{color:'#fff', fontSize:'22px', fontWeight:'bold', marginBottom:'4px'}},
          '🤖 로보틱스 종목발굴 대시보드'),
        e('p', {style:{color:'#a7f3d0', fontSize:'13px'}}, '2026-06-14 · 11종목 · 탑다운 밸류체인 분석')
      ),
      e('div', {style:{background:'#111827', padding:'8px', display:'flex', overflowX:'auto', gap:'4px'}},
        TABS.map(function(t, i) {
          return e('button', {
            key: i,
            onClick: function(){ setTab(i); },
            style:{
              background: tab===i ? THEME : 'transparent',
              color: tab===i ? '#000' : '#9ca3af',
              border: 'none', borderRadius: '6px', padding: '8px 12px',
              cursor: 'pointer', fontSize: '12px', fontWeight: 'bold',
              whiteSpace: 'nowrap', flexShrink: 0
            }
          }, t);
        })
      ),
      tab===0 && Tab1(),
      tab===1 && Tab2(),
      tab===2 && Tab3(),
      tab===3 && e(Tab4, null),
      tab===4 && e(Tab5, null),
      tab===5 && Tab6()
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(App, null));
})();
</script>
</body>
</html>

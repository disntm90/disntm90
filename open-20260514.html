function CJSChart({ config, height=220 }) {
  const ref = useRef(null), inst = useRef(null)
  useEffect(() => {
    if (inst.current) inst.current.destroy()
    inst.current = new Chart(ref.current, config)
    return () => inst.current?.destroy()
  }, [])
  return <canvas ref={ref} style={{width:'100%',maxHeight:height}} height={height}/>
}

const Card = ({children,style={}}) => (
  <div style={{background:C.cardBg,border:`1px solid ${C.border}`,borderRadius:16,padding:'20px 16px',marginBottom:14,...style}}>

      {/* 헤더 */}
      <div style={{background:'linear-gradient(180deg,#001a18 0%,#0a0f1e 100%)',padding:'20px 16px 22px'}}>
        <a href="https://disntm90.github.io/disntm90/" style={{display:'inline-flex',alignItems:'center',gap:6,color:'#7a90aa',fontSize:12,textDecoration:'none',marginBottom:14,padding:'5px 10px',background:'#1e2d45',borderRadius:6}}>← 목록으로</a>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}>
          <div style={{background:C.teal+'20',border:`2px solid ${C.teal}`,borderRadius:10,padding:'6px 14px'}}>
            <span style={{color:C.teal,fontWeight:900,fontSize:22,letterSpacing:1}}>OPEN</span>
          </div>
          <div>
            <div style={{fontWeight:800,fontSize:17,lineHeight:1.2}}>Opendoor Technologies</div>
            <div style={{color:C.muted,fontSize:12,marginTop:3}}>iBuying · AI 주택 플랫폼 · NASDAQ</div>
          </div>
        </div>
        <div style={{display:'flex',flexWrap:'wrap',marginBottom:16}}>
          <Badge color={C.green}>CEO 내부자 매수 🟢</Badge>
          <Badge color={C.teal}>EBITDA 흑자 전환 목표</Badge>
          <Badge color={C.red}>MA 하회 (단기 약세)</Badge>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
          {[
            {label:'현재가', value:'$4.85', sub:'ATH -55%', color:C.teal},
            {label:'52주 고점', value:'$10.87', sub:'', color:C.green},
            {label:'52주 저점', value:'$0.508', sub:'', color:C.red},
            {label:'Q1 매입', value:'+45% QoQ', sub:'2022 이후 최고', color:C.green},
            {label:'기여마진', value:'4.4%', sub:'+3.4pp QoQ', color:C.teal},
            {label:'현금', value:'$999M', sub:'충분한 유동성', color:C.teal},
          ].map((s,i) => (
            <div key={i} style={{background:C.cardBg,border:`1px solid ${C.border}`,borderRadius:12,padding:'11px 8px',textAlign:'center'}}>
              <div style={{color:s.color,fontSize:i===3||i===4?13:18,fontWeight:900,lineHeight:1}}>{s.value}</div>
              <div style={{color:C.muted,fontSize:10,marginTop:4}}>{s.label}</div>
              {s.sub && <div style={{color:s.color+'bb',fontSize:10,marginTop:2}}>{s.sub}</div>}
            </div>
          ))}
        </div>
      </div>

      {/* 탭바 */}
      <div style={{borderBottom:`1px solid ${C.border}`,background:C.cardBg,overflowX:'auto',whiteSpace:'nowrap',WebkitOverflowScrolling:'touch'}}>
        {tabs.map(t => (
          <button key={t.id} onClick={()=>setTab(t.id)} style={{
            display:'inline-block',background:'none',
            color:tab===t.id?C.teal:C.muted,
            border:'none',borderBottom:tab===t.id?`3px solid ${C.teal}`:'3px solid transparent',
            padding:'13px 16px',fontSize:12,fontWeight:700,cursor:'pointer',
          }}>{t.label}</button>
        ))}
      </div>

      {/* 콘텐츠 */}
      <div style={{padding:'16px',maxWidth:600,margin:'0 auto'}}>
        {tab==='overview' && <OverviewTab/>}
        {tab==='tech'     && <TechTab/>}
        {tab==='ibuying'  && <IBuyingTab/>}
        {tab==='fund'     && <FinancialTab/>}
        {tab==='sent'     && <SentimentTab/>}
        {tab==='conclude' && <ConclusionTab/>}
      </div>
    </div>
  )
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
</script>

              'AMBA FY2027 가이던스 상향 예정 (2026 Q2)',
              'NOVT 의료 로봇 FDA 승인 사이클 (2026 하반기)',
              'SERV Uber Eats 플릿 4,000기 확장 발표',
              '미국 최저임금 인상 → 서비스 로봇 수요 가속'
            ].map(function(c,i){ return <span key={i} className="catalyst-tag" style={{display:'block',marginBottom:4}}>✅ {c}</span>; })}
          </div>
          <div>
            <div style={{fontSize:13,fontWeight:700,color:'#ef4444',marginBottom:8}}>주요 리스크</div>
            {[
              'NVDA Jetson 차세대 로봇 SoC 공격적 출시 (AMBA 경쟁)',
              'SERV·RR 적자 지속 시 자금조달 희석 위험',
              'SYM 고평가 시총 $29B — 성장 실망 시 급락',
              '미중 기술 규제 강화 (로봇 수출 통제)',
              '금리 환경 반전 시 성장주 멀티플 압축'
            ].map(function(r,i){ return <span key={i} className="risk-tag" style={{display:'block',marginBottom:4}}>⚠️ {r}</span>; })}
          </div>
        </div>

        <div className="section-title">💼 포트폴리오 제안</div>
        <div className="card">
          {STOCKS.map(function(s){
            return (
              <div key={s.ticker} className="portfolio-row">
                <span className="portfolio-ticker">{s.ticker}</span>
                <div className="portfolio-bar">
                  <div className="portfolio-fill" style={{width:s.portfolio+'%'}}></div>
                </div>
                <span className="portfolio-pct">{s.portfolio}%</span>
              </div>
            );
          })}
          <div style={{fontSize:12,color:'#6b7280',marginTop:14,lineHeight:1.7}}>
            💡 <strong style={{color:'#10b981'}}>핵심 전략:</strong> AMBA+NOVT(중류 병목) 50% 집중 — 휴머노이드 상용화와 직결된 숨겨진 핵심 노드. SERV(20%)는 RSI 과매도 반등 베팅. SYM·RR(30%)은 하류 분산.
          </div>
        </div>

        <div className="section-title">🔗 심층 분석 연계</div>
        <div className="card">
          <div style={{fontSize:13,color:'#9ca3af',lineHeight:1.8}}>
            발굴 종목 중 관심 종목에 대해 <span style={{color:'#10b981',fontWeight:700}}>"[티커] 분석해줘"</span> 로 7개 섹션 심층 분석 + 개별 대시보드 생성을 요청할 수 있습니다.
            <br/>
            <br/>예: <span style={{color:'#10b981'}}>"AMBA 분석해줘"</span> → 실시간 데이터 수집 + 7섹션 분석 + 인터랙티브 대시보드 생성 + gh-pages 배포
          </div>
        </div>
      </div>
    );
  }

  var TABS = [
    {id:'vc', label:'🗺️ 밸류체인'},
    {id:'tech', label:'🔬 기술분석'},
    {id:'stocks', label:'🔍 발굴종목'},
    {id:'charts', label:'📊 비교차트'},
    {id:'multi', label:'🔟 멀티배거'},
    {id:'strategy', label:'🎯 전략'}
  ];

  function App() {
    var tabState = useState('vc');
    var tab = tabState[0];
    var setTab = tabState[1];

    return (
      <div>
        <div className="header">
          <a className="header-back" href="https://disntm90.github.io/disntm90/">← 목록으로</a>
          <div className="header-title">🤖 AI 로보틱스 종목발굴</div>
          <div className="header-sub">탑다운 × 밸류체인 분석 | 2026.05.29 | 발굴 5종목</div>
        </div>
        <div className="tabs">
          {TABS.map(function(t){
            return (
              <div key={t.id}
                className={'tab' + (tab===t.id ? ' active' : '')}
                onClick={function(){setTab(t.id);}}>
                {t.label}
              </div>
            );
          })}
        </div>
        {tab==='vc' && <TabValuChain/>}
        {tab==='tech' && <TabTech/>}
        {tab==='stocks' && <TabStocks/>}
        {tab==='charts' && <TabCharts/>}
        {tab==='multi' && <TabMulti/>}
        {tab==='strategy' && <TabStrategy/>}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

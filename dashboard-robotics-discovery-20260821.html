function makeChart(cRef, chRef, cfg) {

}

      e('h1', null, '🤖 로보틱스 종합 종목발굴 (전범위 재분석)'),
      e('div', {className:'sub'}, '이전+신규 종합 · 휴머노이드·물류·수술·산업 · BOM 8개 | 2026-08-19 | 16개 발굴종목')
    ),
    e('div', {className:'tabs'},
      TABS.map(function(n,i){
        return e('button', {key:i, className:'tb'+(tab===i?' on':''), onClick:function(){setTab(i);}}, n);
      })
    ),
    e('div', {className:'cnt'},
      tab===0 ? Tab1() :
      tab===1 ? Tab2() :
      tab===2 ? e(Tab3,null) :
      tab===3 ? e(Tab4,null) :
      tab===4 ? e(Tab5,null) :
      e(Tab6,null)
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App,null));
</script>
</body>

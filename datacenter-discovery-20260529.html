function makeChart(ref, chartRef, cfg) {
  useEffect(function() {
    if (!ref.current) return;
    if (chartRef.current) { chartRef.current.destroy(); }
    chartRef.current = new Chart(ref.current.getContext('2d'), cfg);
    return function() { if (chartRef.current) { chartRef.current.destroy(); } };
  }, []);
}

function RSIBar(props) {
  var v = props.v;
  var color = v < 35 ? '#34d399' : v > 65 ? '#f87171' : '#fbbf24';
  var label = v < 35 ? '과매도' : v > 65 ? '과매수' : '중립';
  return e('div', {style:{marginTop:4}},
    e('div', {style:{display:'flex', justifyContent:'space-between', fontSize:11, marginBottom:2}},
      e('span', {style:{color:'#9ca3af'}}, 'RSI ' + v),
      e('span', {style:{color:color}}, label)
    ),
    e('div', {style:{background:'#374151', borderRadius:4, height:6, position:'relative'}},
      e('div', {style:{
        position:'absolute', height:6, borderRadius:4,
        width:(v)+'%', background:color, maxWidth:'100%'
      }})
    )
  );
}

function MBBar(props) {
  var pct = (props.v / 8) * 100;
  var color = pct >= 62.5 ? ACCENT : pct >= 50 ? '#fbbf24' : '#6b7280';
  return e('div', {style:{marginTop:4}},
    e('div', {style:{display:'flex', justifyContent:'space-between', fontSize:11, marginBottom:2}},
      e('span', {style:{color:'#9ca3af'}}, '멀티배거'),

    e('div', {style:{background:'#374151', borderRadius:4, height:6}},
      e('div', {style:{height:6, borderRadius:4, width:pct+'%', background:color}})

}

  /* ─── 탭4: 비교차트 ─── */
  function TabChart() {
    var capRef = useRef(null); var capChart = useRef(null);
    var multiRef = useRef(null); var multiChart = useRef(null);
    var rsiRef = useRef(null); var rsiChart = useRef(null);

    var labels = STOCKS.map(function(s){return s.ticker;});
    var caps = STOCKS.map(function(s){return s.capNum;});
    var multis = STOCKS.map(function(s){return s.multi;});
    var rsis = STOCKS.map(function(s){return s.rsi;});
    var colors = STOCKS.map(function(s){return s.unsexy ? '#f59e0b' : '#10b981';});
    var colorsA = STOCKS.map(function(s){return s.unsexy ? 'rgba(245,158,11,0.7)' : 'rgba(16,185,129,0.7)';});

    var opts = {
      responsive: true, maintainAspectRatio: false,
      plugins: {legend:{display:false}},
      scales: {
        x: {ticks:{color:'#9ca3af',font:{size:11}}, grid:{color:'#1f2937'}},
        y: {ticks:{color:'#9ca3af',font:{size:11}}, grid:{color:'#1f2937'}}
      }
    };

    makeChart(capRef, capChart, {type:'bar', data:{labels:labels, datasets:[{label:'시총($B)',data:caps,backgroundColor:colorsA,borderColor:colors,borderWidth:1,borderRadius:4}]}, options:opts});
    makeChart(multiRef, multiChart, {type:'bar', data:{labels:labels, datasets:[{label:'멀티배거점수',data:multis,backgroundColor:colorsA,borderColor:colors,borderWidth:1,borderRadius:4}]}, options:{...opts, scales:{...opts.scales, y:{...opts.scales.y, min:0, max:8}}}});
    makeChart(rsiRef, rsiChart, {
      type:'bar',
      data:{labels:labels, datasets:[{label:'RSI',data:rsis,backgroundColor:rsis.map(function(r){return r<40?'rgba(239,68,68,0.7)':r>60?'rgba(245,158,11,0.7)':'rgba(16,185,129,0.7)';}),borderColor:rsis.map(function(r){return r<40?'#ef4444':r>60?'#f59e0b':'#10b981';}),borderWidth:1,borderRadius:4}]},
      options:{...opts, scales:{...opts.scales, y:{...opts.scales.y, min:0, max:100}}}
    });

    return e('div', {className:'content'},
      e('div', {className:'section-title'}, '📊 시가총액 비교 ($B)'),
      e('div', {className:'chart-wrap'}, e('canvas', {ref:capRef})),
      e('div', {className:'section-title'}, '📊 멀티배거 점수 (/ 8)'),
      e('div', {className:'chart-wrap'}, e('canvas', {ref:multiRef})),
      e('div', {className:'section-title'}, '📊 RSI 비교'),
      e('div', {className:'chart-wrap'}, e('canvas', {ref:rsiRef})),
      e('div', {className:'text-sm', style:{textAlign:'center',marginTop:'8px'}},
        '초록 = 중립(40~60) | 빨강 = 과매도(<40) | 주황 = 과매수(>60)'
      )
    );
  }

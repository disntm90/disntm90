            e('tr',null,e('td',null,'성장(생산량 신규진입)'),e('td',null,'052710, 001820'),e('td',null,'20%')),

}

/* ── App ── */
function App() {
  var sa = useState(0); var tab = sa[0]; var setTab = sa[1];
  var TABS = ['🗺️밸류체인','🔬기술분석','🔍발굴종목','📊비교차트','🔟멀티배거','🎯전략'];
  return e('div', null,
    e('div', {className:'hdr'},
      e('a', {href:'https://disntm90.github.io/disntm90/', className:'back'}, '← 목록으로'),
      e('h1', null, '⚡ MLCC 종목발굴 (BOM 병목 기준)'),
      e('div', {className:'sub'}, 'AI서버 전력공급 밸류체인 · BOM 8개 라인아이템 분석 | 2026-06-23 | 14개 발굴종목')
    ),
    e('div', {className:'tabs'},
      TABS.map(function(n,i){
        return e('button', {key:i, className:'tb'+(tab===i?' on':''), onClick:function(){setTab(i);}}, n);
      })
    ),
    e('div', {className:'cnt'},
      tab===0 ? Tab1() :
      tab===1 ? Tab2() :
      tab===2 ? e(Tab3,null) :
      tab===3 ? e(Tab4,null) :
      tab===4 ? e(Tab5,null) :
      e(Tab6,null)
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App,null));

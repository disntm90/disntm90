function makeChart(cRef, chRef, cfg) {

    if (!cRef.current) return;
    if (chRef.current) chRef.current.destroy();
    chRef.current = new Chart(cRef.current, cfg);
    return function() { if (chRef.current) { chRef.current.destroy(); chRef.current = null; } };
  }, []);
}

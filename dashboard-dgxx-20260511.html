function CJSChart({ config, height=220 }) {
  const ref = useRef(null), inst = useRef(null)
  useEffect(() => {
    if (inst.current) inst.current.destroy()
    inst.current = new Chart(ref.current, config)
    return () => inst.current?.destroy()
  }, [])
  return <canvas ref={ref} style={{width:'100%',maxHeight:height}} height={height}/>
}

const Card = ({children,style={}}) => (
  <div style={{background:C.cardBg,border:`1px solid ${C.border}`,borderRadius:16,padding:'20px 16px',marginBottom:14,...style}}>

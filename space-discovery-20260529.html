function makeChart(ref, chartRef, cfg) {

    if (!ref.current) return;
    if (chartRef.current) { chartRef.current.destroy(); }

function MultiBar(props) {
  var val = props.val || 0;
  var pct = (val/8)*100;
  var col = pct>=75?'#22c55e':pct>=50?'#f59e0b':'#ef4444';
  return e('div',{style:{marginTop:6}},
    e('div',{style:{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:3}},
      e('span',{style:{color:'#94a3b8'}},'멀티배거'),
      e('span',{style:{color:col,fontWeight:700}},val+'/8')
    ),
    e('div',{className:'progress-bar'},
      e('div',{className:'progress-fill',style:{width:pct+'%',background:col}})
    )
  );
}

function TabCharts() {

  var labels = STOCKS.map(function(s){return s.ticker;});

  makeChart(capRef, capChart, {

      datasets:[{

        borderRadius:6

  makeChart(multiRef, multiChart, {
    type:'radar',
    data:{
      labels:['대형TAM','경쟁해자','반복매출','경영진','재무상태','매출성장','고객분산','밸류에이션'],

  });

  return e('div',{style:{padding:'16px'}},
    e('div',{className:'card'},
      e('div',{className:'section-title'},'📊 시가총액 비교 ($B)'),

      e('div',{className:'section-title'},'📈 RSI 현황 (🟢<50 진입 | 🟡50~70 중립 | 🔴>70 과열)'),
      e('div',{className:'chart-wrap'},e('canvas',{ref:rsiRef}))

    e('div',{className:'card'},
      e('div',{className:'section-title'},'🕸️ 멀티배거 레이더 (Anna Yartseva 8항목)'),
      e('div',{className:'chart-wrap',style:{height:280}},e('canvas',{ref:multiRef}))

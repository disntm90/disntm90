var useRef    = React.useRef;

function e(tag, props) {
  var args = [tag, props || null];
  for (var i = 2; i < arguments.length; i++) args.push(arguments[i]);
  return React.createElement.apply(React, args);
}

function makeChart(ref, chartRef, cfg) {
  useEffect(function() {
    if (!ref.current) return;
    if (chartRef.current) { chartRef.current.destroy(); }
    chartRef.current = new Chart(ref.current.getContext('2d'), cfg);
    return function() { if (chartRef.current) { chartRef.current.destroy(); } };
  }, []);
}

function MultiBar(props) {
  var val = props.val || 0;
  var pct = (val/8)*100;
  var col = pct>=75?'#22c55e':pct>=50?'#f59e0b':'#ef4444';
  return e('div',{style:{marginTop:6}},
    e('div',{style:{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:3}},
      e('span',{style:{color:'#64748b'}},'멀티배거'),
      e('span',{style:{color:col,fontWeight:700}},val+'/8')
    ),
    e('div',{className:'progress-bar'},
      e('div',{className:'progress-fill',style:{width:pct+'%',background:col}})
    )
  );
}

function StarRow(props) {
  var n = props.n || 0;
  return e('div',{style:{display:'flex',gap:4,marginBottom:6}},
    [0,1,2].map(function(i){
      return e('span',{key:i,style:{fontSize:14,color:i<n?'#fbbf24':'#374151'}},'★');
    })
  );
}

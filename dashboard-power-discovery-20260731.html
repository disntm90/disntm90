      e('a', {href:'https://disntm90.github.io/disntm90/', className:'back'}, '← 목록으로'),
      e('h1', null, '⚡ AGI 전력병목 종목발굴 (Situational Awareness 기반)'),
      e('div', {className:'sub'}, '"전력이 AGI의 진짜 병목" · BOM 8개 라인아이템 | 2026-07-31 | 13개 발굴종목')
    ),
    e('div', {className:'tabs'},
      TABS.map(function(n,i){
        return e('button', {key:i, className:'tb'+(tab===i?' on':''), onClick:function(){setTab(i);}}, n);
      })
    ),
    e('div', {className:'cnt'},
      tab===0 ? Tab1() :
      tab===1 ? Tab2() :
      tab===2 ? e(Tab3,null) :
      tab===3 ? e(Tab4,null) :
      tab===4 ? e(Tab5,null) :
      e(Tab6,null)
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App,null));
</script>
